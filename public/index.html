<!doctype html><html lang=zh-CN><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Our Little Universe ♥</title><style>body{font-family:system-ui;margin:0;background:linear-gradient(135deg,#fff4f8,#f7f3ff);color:#432e3a}main{max-width:900px;margin:auto;padding:18px}.card{background:#fffC;padding:22px;margin:12px 0;border-radius:22px;box-shadow:0 12px 35px #0001}button{padding:10px 14px;border:0;border-radius:12px;background:#ff6397;color:white}input,textarea{width:100%;padding:11px;border:1px solid #eadde5;border-radius:12px;margin:6px 0 12px;box-sizing:border-box}.nav{display:flex;gap:7px;overflow:auto}.nav button{background:white;color:#765;border:1px solid #eadde5;white-space:nowrap}.nav .on{background:#432e3a;color:white}.page{display:none}.page.on{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#927e89;font-size:13px;line-height:1.7}.photo{display:inline-block;width:31%;aspect-ratio:1;margin:1%;overflow:hidden;border-radius:14px}.photo img{width:100%;height:100%;object-fit:cover}.msg{padding:10px;background:#fff;border-radius:14px;margin:7px 0}.mine{background:#ffe8f0;text-align:right}@media(max-width:650px){.grid{grid-template-columns:1fr}.photo{width:47%}}</style><main><div class=card><b style="color:#f45">♥ Our Little Universe</b><h1>把喜欢的人，<br><span style="color:#ff6397">留在每一天。</span></h1><p class=muted>真正属于两个人的私人空间：回忆、相册、纪念日、情书和悄悄话。</p><div id=stats></div></div><div id=auth class=card><h2>进入你们的空间</h2><input id=name placeholder=昵称><input id=email placeholder=邮箱><input id=pass type=password placeholder=密码（至少6位）><button onclick=authGo()>注册 / 登录</button><p id=err class=muted></p><p class=muted>注册：填写昵称；登录：昵称留空。</p></div><div id=app class=hide><div class=nav><button onclick=tab('home',this)>首页</button><button onclick=tab('memory',this)>时光轴</button><button onclick=tab('photo',this)>相册</button><button onclick=tab('anniv',this)>纪念日</button><button onclick=tab('letter',this)>情书</button><button onclick=tab('chat',this)>悄悄话</button><button onclick=tab('space',this)>情侣绑定</button></div><section id=home class="page on card"><h2>今天也要好好爱 💗</h2><div id=recent></div></section><section id=memory class="page card"><h2>时光轴</h2><input id=mt placeholder=标题><input id=md type=date><textarea id=mb placeholder=想留下的话></textarea><button onclick=addMemory()>收藏这一天</button><div id=memories></div></section><section id=photo class="page card"><h2>相册</h2><input id=pt placeholder=照片标题><input id=pf type=file accept=image/*><button onclick=addPhoto()>上传照片</button><div id=photos></div></section><section id=anniv class="page card"><h2>纪念日</h2><input id=at placeholder=名称><input id=ad type=date><input id=an placeholder=备注><button onclick=addAnniv()>保存</button><div id=annivs></div></section><section id=letter class="page card"><h2>情书</h2><input id=lt value="最喜欢的你"><textarea id=lb placeholder=写给TA的话></textarea><input id=ls value="爱你的人"><button onclick=addLetter()>封存情书</button><div id=letters></div></section><section id=chat class="page card"><h2>悄悄话 💬</h2><div id=messages style="height:360px;overflow:auto"></div><input id=ci placeholder="给TA发一句话"><button onclick=sendMsg()>发送</button></section><section id=space class="page card"><h2>情侣绑定</h2><p class=muted>把邀请码发给另一半，TA登录后输入即可加入。</p><h2 id=invite>—</h2><input id=jc placeholder=LOVE-XXXXXX><button onclick=join()>加入TA的空间</button></section></div></main><script>let T=localStorage.cu||'';let D={};const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+T,'Content-Type':'application/json'};let r=await fetch('/api'+p,o),j=await r.json();if(!r.ok)throw Error(j.error);return j}function tab(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}function esc(s){return String(s||'').replace(/[&<>\"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[x]) )}async function authGo(){try{let login=!$('name').value;let j=await api(login?'/login':'/register',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value,name:$('name').value})});T=j.token;localStorage.cu=T;$('auth').style.display='none';$('app').classList.remove('hide');await load()}catch(e){$('err').textContent=e.message}}async function load(){try{let m=await api('/me');let d=await api('/data');D=d;$('invite').textContent=m.space.invite;$('stats').innerHTML=`<b>${d.members.length}/2</b> 情侣成员　 <b>${d.memories.length}</b> 条回忆`;$('recent').innerHTML=d.memories.slice(0,3).map(x=>`<div class=card><b>${esc(x.title)}</b><p class=muted>${esc(x.date)} · ${esc(x.body)}</p></div>`).join('');$('memories').innerHTML=d.memories.map(x=>`<div class=card><b>${esc(x.title)}</b><p>${esc(x.body)}</p><small>${x.date}</small></div>`).join('');$('photos').innerHTML=d.photos.map(x=>`<div class=photo><img src="${x.data}"></div>`).join('');$('annivs').innerHTML=d.annivs.map(x=>`<div class=card><b>💞 ${esc(x.title)}</b><p>${x.date}</p>${esc(x.note)}</div>`).join('');$('letters').innerHTML=d.letters.map(x=>`<div class=card><b>${esc(x.to)}</b><p>${esc(x.body)}</p><small>——${esc(x.sign)}</small></div>`).join('');$('messages').innerHTML=d.messages.map(x=>`<div class=msg><b>${esc(x.name)}</b><br>${esc(x.body)}<small class=muted>${new Date(x.created_at).toLocaleString()}</small></div>`).join('')}catch(e){localStorage.removeItem('cu');location.reload()}}async function addMemory(){try{await api('/memories',{method:'POST',body:JSON.stringify({title:$('mt').value,body:$('mb').value,date:$('md').value||today()})});$('mt').value=$('mb').value='';load()}catch(e){alert(e.message)}}async function addAnniv(){try{await api('/annivs',{method:'POST',body:JSON.stringify({title:$('at').value,date:$('ad').value,note:$('an').value})});load()}catch(e){alert(e.message)}}async function addLetter(){try{await api('/letters',{method:'POST',body:JSON.stringify({to:$('lt').value,body:$('lb').value,sign:$('ls').value,date:today()})});load()}catch(e){alert(e.message)}}async function addPhoto(){let f=$('pf').files[0];if(!f)return alert('请选择照片');if(f.size>8e6)return alert('照片超过8MB');let r=new FileReader;r.onload=async()=>{try{await api('/photos',{method:'POST',body:JSON.stringify({title:$('pt').value||'我们的照片',date:today(),data:r.result})});load()}catch(e){alert(e.message)}};r.readAsDataURL(f)}async function sendMsg(){try{let v=$('ci').value.trim();if(!v)return;await api('/messages',{method:'POST',body:JSON.stringify({body:v})});$('ci').value='';load()}catch(e){alert(e.message)}}async function join(){try{await api('/join',{method:'POST',body:JSON.stringify({invite:$('jc').value})});alert('加入成功');load()}catch(e){alert(e.message)}}if(T){$('auth').style.display='none';$('app').classList.remove('hide');load()}</script></html>
